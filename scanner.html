<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escáner</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    video {
      width: 100%;
      height: 75vh;
      object-fit: cover;
      background: #000;
    }

    #estado {
      padding: 20px;
      font-size: 18px;
    }

    #resultado {
      font-size: 24px;
      font-weight: bold;
      padding: 20px;
    }

    button {
      padding: 15px 30px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
    }

    #btnIniciar {
      background: #00c853;
      color: white;
      font-weight: bold;
    }

    #btnCancelar {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <div id="estado">
    Pulsa "Activar cámara"
  </div>

  <video id="video" autoplay muted playsinline></video>

  <div id="resultado"></div>

  <button id="btnIniciar" onclick="iniciar()">
    📷 Activar cámara
  </button>

  <button id="btnCancelar" onclick="volver()">
    Cancelar
  </button>

  <script src="./zxing-browser.min.js"></script>

  <script>

    const video =
      document.getElementById("video");

    const estado =
      document.getElementById("estado");

    const resultado =
      document.getElementById("resultado");

    const btnIniciar =
      document.getElementById("btnIniciar");

    let lector = null;
    let controles = null;


    async function iniciar() {

      btnIniciar.disabled = true;

      estado.innerHTML =
        "Solicitando acceso a la cámara...";

      try {

        // Primero solicitamos directamente
        // permiso a la cámara.

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: {
                ideal: "environment"
              }
            },
            audio: false
          });

        // Mostramos la cámara.

        video.srcObject = stream;

        await video.play();


        // Verificar ZXing

        if (!window.ZXingBrowser) {

          throw new Error(
            "ZXingBrowser no está cargado."
          );
        }


        estado.innerHTML =
          "📷 Apunta al código de barras";


        lector =
          new ZXingBrowser.BrowserMultiFormatReader();


        controles =
          await lector.decodeFromConstraints(
            {
              video: {
                facingMode: {
                  ideal: "environment"
                },
                width: {
                  ideal: 1920
                },
                height: {
                  ideal: 1080
                }
              },
              audio: false
            },
            video,
            function(resultadoCodigo, error) {

              if (resultadoCodigo) {

                const codigo =
                  resultadoCodigo.getText();

                console.log(
                  "Código detectado:",
                  codigo
                );

                resultado.innerHTML =
                  "Código detectado:<br>" +
                  codigo;

                detener();

                setTimeout(function() {

                  enviarCodigo(codigo);

                }, 500);
              }

            }
          );

      } catch (error) {

        console.error(error);

        btnIniciar.disabled = false;

        estado.innerHTML =
          "❌ Error al iniciar la cámara:<br><br>" +
          error.message;

      }
    }


    function detener() {

      try {

        if (controles) {

          if (
            typeof controles.stop ===
            "function"
          ) {
            controles.stop();
          }

          controles = null;
        }

        if (lector) {

          if (
            typeof lector.reset ===
            "function"
          ) {
            lector.reset();
          }

          lector = null;
        }

        if (video.srcObject) {

          video.srcObject
            .getTracks()
            .forEach(function(track) {

              track.stop();

            });

          video.srcObject = null;
        }

      } catch (error) {

        console.log(error);

      }
    }


    function enviarCodigo(codigo) {

      const parametros =
        new URLSearchParams(
          window.location.search
        );

      const retorno =
        parametros.get("retorno");


      if (!retorno) {

        estado.innerHTML =
          "Código detectado: " +
          codigo;

        return;
      }


      const url =
        decodeURIComponent(retorno);

      const separador =
        url.includes("?")
          ? "&"
          : "?";


      window.location.href =
        url +
        separador +
        "barcode=" +
        encodeURIComponent(codigo);
    }


    function volver() {

      detener();

      const parametros =
        new URLSearchParams(
          window.location.search
        );

      const retorno =
        parametros.get("retorno");


      if (retorno) {

        window.location.href =
          decodeURIComponent(retorno);

      } else {

        window.history.back();

      }
    }

  </script>

</body>
</html>
