<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Escanear código de barras</title>

<!-- ZXING -->
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;
  padding:0;

  width:100%;
  height:100%;

  background:#000;

  overflow:hidden;

  font-family:Arial,sans-serif;

  color:#fff;

}

#contenedor{

  position:fixed;

  inset:0;

  background:#000;

}

#video{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;

}

#superior{

  position:absolute;

  top:0;
  left:0;
  right:0;

  padding:20px;

  text-align:center;

  background:
    linear-gradient(
      rgba(0,0,0,.85),
      rgba(0,0,0,0)
    );

  z-index:10;

}

#titulo{

  font-size:21px;

  font-weight:bold;

}

#estado{

  margin-top:8px;

  font-size:14px;

  opacity:.9;

}

#marco{

  position:absolute;

  width:85%;

  max-width:450px;

  height:180px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  border:
    3px solid #00ff66;

  border-radius:14px;

  z-index:5;

  box-shadow:
    0 0 20px
    rgba(0,255,100,.4);

}

#linea{

  position:absolute;

  left:5%;
  right:5%;

  top:10%;

  height:2px;

  background:#00ff66;

  box-shadow:
    0 0 8px #00ff66;

  animation:mover 1.5s infinite;

}

@keyframes mover{

  0%{
    top:10%;
  }

  50%{
    top:90%;
  }

  100%{
    top:10%;
  }

}

#inferior{

  position:absolute;

  bottom:0;

  left:0;
  right:0;

  padding:25px;

  text-align:center;

  background:
    linear-gradient(
      rgba(0,0,0,0),
      rgba(0,0,0,.9)
    );

  z-index:10;

}

#resultado{

  display:none;

  margin-bottom:15px;

  padding:12px;

  border-radius:8px;

  background:
    rgba(0,0,0,.75);

  font-size:21px;

  font-weight:bold;

}

button{

  width:100%;

  max-width:350px;

  padding:15px;

  border:none;

  border-radius:10px;

  font-size:17px;

  font-weight:bold;

  background:#fff;

  color:#000;

  cursor:pointer;

}

#error{

  display:none;

  position:absolute;

  left:20px;
  right:20px;

  top:50%;

  transform:
    translateY(-50%);

  padding:20px;

  background:
    rgba(150,0,0,.95);

  border-radius:12px;

  text-align:center;

  z-index:30;

  line-height:1.5;

}

</style>

</head>


<body>

<div id="contenedor">

  <video
    id="video"
    autoplay
    muted
    playsinline
  ></video>


  <div id="superior">

    <div id="titulo">
      Escanear código de barras
    </div>

    <div id="estado">
      Iniciando lector...
    </div>

  </div>


  <div id="marco">

    <div id="linea"></div>

  </div>


  <div id="inferior">

    <div id="resultado"></div>

    <button
      onclick="cerrarScanner()"
    >
      Cancelar
    </button>

  </div>


  <div id="error">

    <div id="mensajeError"></div>

  </div>

</div>


<script>

var video =
  document.getElementById('video');

var estado =
  document.getElementById('estado');

var resultado =
  document.getElementById('resultado');

var errorBox =
  document.getElementById('error');

var mensajeError =
  document.getElementById('mensajeError');

var lector = null;

var controles = null;

var procesando = false;


/* =========================
   PARÁMETROS
========================= */

var parametros =
  new URLSearchParams(
    window.location.search
  );

var retorno =
  parametros.get('retorno') || '';


/* =========================
   INICIAR
========================= */

async function iniciarScanner(){

  try{

    estado.textContent =
      'Comprobando lector...';


    /*
      Comprobar que ZXing
      realmente cargó.
    */

    if(
      typeof ZXing === 'undefined'
    ){

      throw new Error(
        'ZXing no se cargó desde el servidor.'
      );

    }


    if(
      !ZXing.BrowserMultiFormatReader
    ){

      throw new Error(
        'BrowserMultiFormatReader no está disponible.'
      );

    }


    estado.textContent =
      'Activando cámara...';


    lector =
      new ZXing.BrowserMultiFormatReader();


    /*
      No necesitamos manejar
      manualmente getUserMedia.

      ZXing se encarga de seleccionar
      la cámara y realizar la lectura.
    */

    controles =
      await lector.decodeFromConstraints(

        {

          video:{

            facingMode:{
              ideal:'environment'
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:false

        },

        video,

        function(
          lectura,
          error,
          controlesScanner
        ){

          if(procesando){

            return;

          }


          if(lectura){

            var codigo =
              lectura
                .getText()
                .trim();


            if(!codigo){

              return;

            }


            procesando = true;


            codigoDetectado(
              codigo
            );

          }

        }

      );


    estado.textContent =
      'Buscando código...';

  }

  catch(error){

    console.error(
      'ERROR SCANNER:',
      error
    );


    mostrarError(
      error
    );

  }

}


/* =========================
   CÓDIGO DETECTADO
========================= */

function codigoDetectado(
  codigo
){

  estado.textContent =
    'Código encontrado';


  resultado.style.display =
    'block';


  resultado.textContent =
    codigo;


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [100,50,100]
    );

  }


  setTimeout(
    function(){

      regresarAplicacion(
        codigo
      );

    },
    500
  );

}


/* =========================
   REGRESAR A APPS SCRIPT
========================= */

function regresarAplicacion(
  codigo
){

  detenerScanner();


  if(!retorno){

    alert(
      'Código detectado: ' +
      codigo
    );

    return;

  }


  var separador =
    retorno.includes('?')
      ? '&'
      : '?';


  var url =

    retorno +

    separador +

    'barcode=' +

    encodeURIComponent(
      codigo
    );


  window.location.href =
    url;

}


/* =========================
   DETENER
========================= */

function detenerScanner(){

  try{

    if(controles){

      controles.stop();

      controles = null;

    }

  }

  catch(e){

    console.log(e);

  }


  try{

    if(lector){

      lector.reset();

      lector = null;

    }

  }

  catch(e){

    console.log(e);

  }


  if(
    video.srcObject
  ){

    video.srcObject
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

    video.srcObject = null;

  }

}


/* =========================
   ERROR
========================= */

function mostrarError(
  error
){

  var mensaje =
    error &&
    error.message
      ? error.message
      : String(error);


  mensajeError.innerHTML =

    '<strong>' +

      'No se pudo iniciar el lector.'

    + '</strong><br><br>' +

    '<small>' +

      mensaje

    + '</small>';


  errorBox.style.display =
    'block';


  estado.textContent =
    'Error del lector';

}


/* =========================
   CANCELAR
========================= */

function cerrarScanner(){

  detenerScanner();


  if(retorno){

    var separador =
      retorno.includes('?')
        ? '&'
        : '?';


    window.location.href =

      retorno +

      separador +

      'cancelado=1';

  }

  else{

    window.history.back();

  }

}


/* =========================
   LIMPIEZA
========================= */

window.addEventListener(
  'beforeunload',
  function(){

    detenerScanner();

  }
);


/* =========================
   ARRANCAR
========================= */

iniciarScanner();

</script>

</body>

</html>
