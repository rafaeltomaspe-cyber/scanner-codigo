<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escáner de código de barras</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #estado {
      padding: 18px;
      font-size: 18px;
      background: rgba(0,0,0,.85);
    }

    #video {
      width: 100%;
      height: 70vh;
      object-fit: cover;
      background: #000;
    }

    #resultado {
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
    }

    button {
      padding: 14px 25px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
    }

    #btnIniciar {
      background: #00c853;
      color: white;
      font-weight: bold;
    }

    #btnCancelar {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <div id="estado">
    Pulsa "Activar cámara"
  </div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="resultado"></div>

  <button
    id="btnIniciar"
    onclick="iniciarScanner()">
    📷 Activar cámara
  </button>

  <button
    id="btnCancelar"
    onclick="volver()">
    Cancelar
  </button>


  <!-- ZXing LOCAL -->
  <script src="./zxing-browser.min.js"></script>


  <script>

    const video =
      document.getElementById("video");

    const estado =
      document.getElementById("estado");

    const resultado =
      document.getElementById("resultado");

    const btnIniciar =
      document.getElementById("btnIniciar");

    let lector = null;
    let controles = null;


    function iniciarScanner() {

      btnIniciar.disabled = true;

      estado.innerHTML =
        "Solicitando acceso a la cámara...";


      if (!window.ZXingBrowser) {

        estado.innerHTML =
          "❌ No se pudo cargar ZXingBrowser.";

        btnIniciar.disabled = false;

        return;
      }


      try {

        lector =
          new ZXingBrowser.BrowserMultiFormatReader();


        controles =
          lector.decodeFromConstraints(

            {
              video: {

                facingMode: {
                  ideal: "environment"
                },

                width: {
                  ideal: 1920
                },

                height: {
                  ideal: 1080
                }

              },

              audio: false
            },

            video,

            function(resultadoCodigo, error) {

              if (resultadoCodigo) {

                const codigo =
                  resultadoCodigo.getText();


                resultado.innerHTML =
                  "Código detectado:<br>" +
                  codigo;


                estado.innerHTML =
                  "✅ Código encontrado";


                detenerScanner();


                setTimeout(function() {

                  enviarCodigo(codigo);

                }, 500);

              }

            }

          );


        estado.innerHTML =
          "📷 Apunta al código de barras";


      } catch (error) {

        console.error(error);

        btnIniciar.disabled = false;

        estado.innerHTML =
          "❌ Error al iniciar la cámara:<br>" +
          error.message;

      }

    }


    function detenerScanner() {

      try {

        if (controles) {

          if (
            typeof controles.stop ===
            "function"
          ) {
            controles.stop();
          }

          controles = null;
        }


        if (lector) {

          if (
            typeof lector.reset ===
            "function"
          ) {
            lector.reset();
          }

          lector = null;
        }


        if (video.srcObject) {

          video.srcObject
            .getTracks()
            .forEach(function(track) {

              track.stop();

            });

          video.srcObject = null;
        }

      } catch (error) {

        console.log(error);

      }

    }


    function enviarCodigo(codigo) {

  // Enviar el código a la ventana que abrió el scanner
  if (window.opener) {

    window.opener.postMessage(
      {
        tipo: "codigoBarras",
        codigo: codigo
      },
      "https://script.google.com"
    );

    // Cerrar la pestaña del scanner
    setTimeout(function() {
      window.close();
    }, 300);

    return;
  }

  // Si no existe ventana principal,
  // mostrar el código.
  estado.innerHTML =
    "Código detectado: " + codigo;
}

      const url =
        decodeURIComponent(retorno);


      const separador =
        url.includes("?")
          ? "&"
          : "?";


      window.location.href =
        url +
        separador +
        "barcode=" +
        encodeURIComponent(codigo);

    }


    function volver() {

      detenerScanner();


      const parametros =
        new URLSearchParams(
          window.location.search
        );


      const retorno =
        parametros.get("retorno");


      if (retorno) {

        window.location.href =
          decodeURIComponent(retorno);

      } else {

        window.history.back();

      }

    }

  </script>

</body>
</html>
