<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escáner de código de barras</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #contenedor {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #marco {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 85%;
      max-width: 500px;
      height: 150px;
      transform: translate(-50%, -50%);
      border: 3px solid #00ff66;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,255,100,.5);
      pointer-events: none;
    }

    #estado {
      position: fixed;
      top: 20px;
      left: 10px;
      right: 10px;
      padding: 12px;
      text-align: center;
      background: rgba(0,0,0,.7);
      border-radius: 8px;
      font-size: 16px;
      z-index: 10;
    }

    #resultado {
      position: fixed;
      bottom: 90px;
      left: 10px;
      right: 10px;
      padding: 15px;
      background: rgba(0,0,0,.85);
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      display: none;
      z-index: 10;
    }

    #cancelar {
      position: fixed;
      bottom: 20px;
      left: 10%;
      width: 80%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      z-index: 20;
    }
  </style>
</head>

<body>

<div id="contenedor">

  <video id="video" autoplay muted playsinline></video>

  <div id="marco"></div>

  <div id="estado">
    Iniciando lector...
  </div>

  <div id="resultado"></div>

  <button id="cancelar" onclick="volver()">
    Cancelar
  </button>

</div>

<!-- ZXing LOCAL -->
<script src="./zxing-browser.min.js"></script>

<script>

  let lector = null;
  let controles = null;

  const video = document.getElementById("video");
  const estado = document.getElementById("estado");
  const resultado = document.getElementById("resultado");

  function mostrarEstado(texto) {
    estado.textContent = texto;
  }

  function iniciarScanner() {

    // Verificar que ZXing realmente cargó
    if (typeof ZXing === "undefined") {

      mostrarEstado(
        "ERROR: No se pudo cargar ZXing."
      );

      alert(
        "No se pudo cargar el lector.\n\n" +
        "Verifica que zxing-browser.min.js esté " +
        "en el mismo repositorio que scanner.html."
      );

      return;
    }

    mostrarEstado(
      "Apunta la cámara al código de barras..."
    );

    try {

      lector = new ZXing.BrowserMultiFormatReader();

      const restricciones = {
        video: {
          facingMode: {
            ideal: "environment"
          },
          width: {
            ideal: 1920
          },
          height: {
            ideal: 1080
          }
        },
        audio: false
      };

      controles = lector.decodeFromConstraints(
        restricciones,
        video,
        function(resultado, error) {

          if (resultado) {

            const codigo =
              resultado.getText();

            mostrarResultado(codigo);

            detenerScanner();

            setTimeout(function() {
              regresarAplicacion(codigo);
            }, 500);
          }

        }
      );

    } catch (error) {

      console.error(error);

      mostrarEstado(
        "Error al iniciar el lector."
      );

      alert(
        "Error al iniciar el lector:\n\n" +
        error.message
      );
    }
  }


  function mostrarResultado(codigo) {

    resultado.style.display = "block";

    resultado.innerHTML =
      "Código detectado:<br><br>" +
      codigo;
  }


  function detenerScanner() {

    try {

      if (controles) {

        if (typeof controles.stop === "function") {
          controles.stop();
        }

        controles = null;
      }

      if (lector) {

        if (typeof lector.reset === "function") {
          lector.reset();
        }

        lector = null;
      }

      if (video.srcObject) {

        video.srcObject
          .getTracks()
          .forEach(function(track) {
            track.stop();
          });

        video.srcObject = null;
      }

    } catch (error) {

      console.log(error);
    }
  }


  function regresarAplicacion(codigo) {

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const retorno =
      parametros.get("retorno");

    if (!retorno) {

      alert(
        "No se encontró la dirección de retorno."
      );

      return;
    }

    const url =
      decodeURIComponent(retorno);

    const separador =
      url.includes("?") ? "&" : "?";

    window.location.href =
      url +
      separador +
      "barcode=" +
      encodeURIComponent(codigo);
  }


  function volver() {

    detenerScanner();

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const retorno =
      parametros.get("retorno");

    if (retorno) {

      window.location.href =
        decodeURIComponent(retorno);

    } else {

      window.history.back();

    }
  }


  window.addEventListener(
    "beforeunload",
    detenerScanner
  );


  iniciarScanner();

</script>

</body>
</html>
