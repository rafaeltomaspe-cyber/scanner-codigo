<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Escáner de código de barras</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #estado {
      padding: 18px;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.85);
    }

    #video {
      width: 100%;
      height: 70vh;
      object-fit: cover;
      background: #000;
    }

    #resultado {
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
    }

    button {
      padding: 14px 25px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    #btnIniciar {
      background: #00c853;
      color: white;
      font-weight: bold;
    }

    #btnIniciar:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #btnCancelar {
      background: white;
      color: black;
    }

  </style>

</head>


<body>

  <div id="estado">
    Pulsa "Activar cámara"
  </div>


  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <div id="resultado"></div>


  <button
    id="btnIniciar"
    type="button"
    onclick="iniciarScanner()">

    📷 Activar cámara

  </button>


  <button
    id="btnCancelar"
    type="button"
    onclick="volver()">

    Cancelar

  </button>


  <!-- =====================================================
       ZXING LOCAL
       ===================================================== -->

  <script src="./zxing-browser.min.js"></script>


  <script>

    const video =
      document.getElementById("video");

    const estado =
      document.getElementById("estado");

    const resultado =
      document.getElementById("resultado");

    const btnIniciar =
      document.getElementById("btnIniciar");


    let lector = null;

    let controles = null;


    // =====================================================
    // INICIAR SCANNER
    // =====================================================

    function iniciarScanner() {

      console.log(
        "Iniciando lector..."
      );


      btnIniciar.disabled = true;


      estado.innerHTML =
        "Solicitando acceso a la cámara...";


      // Verificar que ZXing esté cargado

      if (
        typeof window.ZXingBrowser ===
        "undefined"
      ) {

        estado.innerHTML =
          "❌ No se pudo cargar ZXing.";

        btnIniciar.disabled = false;

        console.error(
          "ZXingBrowser no está disponible"
        );

        return;
      }


      try {

        lector =
          new ZXingBrowser.BrowserMultiFormatReader();


        const restricciones = {

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: false

        };


        controles =
          lector.decodeFromConstraints(

            restricciones,

            video,

            function(
              resultadoCodigo,
              error
            ) {


              // =================================================
              // CÓDIGO DETECTADO
              // =================================================

              if (resultadoCodigo) {

                const codigo =
                  resultadoCodigo.getText();


                console.log(
                  "Código detectado:",
                  codigo
                );


                estado.innerHTML =
                  "✅ Código detectado";


                resultado.innerHTML =
                  codigo;


                // Detener cámara

                detenerScanner();


                // Enviar código a Apps Script

                setTimeout(
                  function() {

                    enviarCodigo(codigo);

                  },
                  300
                );

              }

            }

          );


        estado.innerHTML =
          "📷 Apunta al código de barras";


      } catch (error) {

        console.error(
          "Error:",
          error
        );


        btnIniciar.disabled = false;


        estado.innerHTML =
          "❌ Error al iniciar la cámara:<br>" +
          error.message;

      }

    }


    // =====================================================
    // DETENER SCANNER
    // =====================================================

    function detenerScanner() {

      try {


        if (controles) {

          if (
            typeof controles.stop ===
            "function"
          ) {

            controles.stop();

          }

          controles = null;

        }


        if (lector) {

          if (
            typeof lector.reset ===
            "function"
          ) {

            lector.reset();

          }

          lector = null;

        }


        if (video.srcObject) {

          const tracks =
            video.srcObject.getTracks();


          tracks.forEach(
            function(track) {

              track.stop();

            }
          );


          video.srcObject = null;

        }


      } catch (error) {

        console.log(
          "Error deteniendo cámara:",
          error
        );

      }

    }


    // =====================================================
    // ENVIAR CÓDIGO A GOOGLE APPS SCRIPT
    // =====================================================

    function enviarCodigo(codigo) {

      console.log(
        "Enviando código:",
        codigo
      );


      // Verificar que esta pestaña
      // fue abierta desde Apps Script

      if (window.opener) {


        try {

          window.opener.postMessage(

            {
              tipo: "codigoBarras",
              codigo: codigo
            },

            "https://script.google.com"

          );


          estado.innerHTML =
            "✅ Código enviado";


          resultado.innerHTML =
            codigo;


          // Cerrar esta pestaña

          setTimeout(
            function() {

              window.close();

            },
            500
          );


          return;


        } catch (error) {

          console.error(
            "Error enviando código:",
            error
          );

        }

      }


      // Si no existe ventana principal

      estado.innerHTML =
        "Código detectado";


      resultado.innerHTML =
        codigo;

    }


    // =====================================================
    // CANCELAR
    // =====================================================

    function volver() {

      detenerScanner();


      if (window.opener) {

        window.close();

      } else {

        window.history.back();

      }

    }


    // =====================================================
    // LIMPIAR CÁMARA AL SALIR
    // =====================================================

    window.addEventListener(
      "beforeunload",
      function() {

        detenerScanner();

      }
    );


  </script>

</body>

</html>
