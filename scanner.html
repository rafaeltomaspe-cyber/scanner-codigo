<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Escáner de código de barras</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #estado {
      padding: 18px;
      font-size: 18px;
      background: rgba(0,0,0,.85);
    }

    #video {
      width: 100%;
      height: 70vh;
      object-fit: cover;
      background: #000;
    }

    #resultado {
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
    }

    button {
      padding: 14px 25px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    #btnIniciar {
      background: #00c853;
      color: white;
      font-weight: bold;
    }

    #btnIniciar:disabled {
      background: #555;
    }

    #btnCancelar {
      background: white;
      color: black;
    }

  </style>

</head>


<body>

  <div id="estado">
    Pulsa "Activar cámara"
  </div>


  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <div id="resultado"></div>


  <button
    id="btnIniciar"
    type="button"
    onclick="iniciarScanner()">

    📷 Activar cámara

  </button>


  <button
    id="btnCancelar"
    type="button"
    onclick="volver()">

    Cancelar

  </button>


  <!-- ZXING LOCAL -->

  <script src="./zxing-browser.min.js"></script>


  <script>

    const video =
      document.getElementById("video");

    const estado =
      document.getElementById("estado");

    const resultado =
      document.getElementById("resultado");

    const btnIniciar =
      document.getElementById("btnIniciar");


    let lector = null;

    let controles = null;


    // =====================================================
    // INICIAR SCANNER
    // =====================================================

    function iniciarScanner() {

      btnIniciar.disabled = true;

      estado.innerHTML =
        "Solicitando acceso a la cámara...";


      if (!window.ZXingBrowser) {

        estado.innerHTML =
          "❌ No se pudo cargar ZXing.";

        btnIniciar.disabled = false;

        return;
      }


      try {

        lector =
          new ZXingBrowser.BrowserMultiFormatReader();


        controles =
          lector.decodeFromConstraints(

            {
              video: {

                facingMode: {
                  ideal: "environment"
                },

                width: {
                  ideal: 1920
                },

                height: {
                  ideal: 1080
                }

              },

              audio: false

            },

            video,

            function(
              resultadoCodigo,
              error
            ) {


              if (resultadoCodigo) {

                const codigo =
                  resultadoCodigo.getText();


                console.log(
                  "Código detectado:",
                  codigo
                );


                estado.innerHTML =
                  "✅ Código detectado";


                resultado.innerHTML =
                  codigo;


                detenerScanner();


                setTimeout(
                  function() {

                    regresarAAppsScript(
                      codigo
                    );

                  },
                  300
                );

              }

            }

          );


        estado.innerHTML =
          "📷 Apunta al código de barras";


      } catch (error) {

        console.error(error);

        btnIniciar.disabled = false;

        estado.innerHTML =
          "❌ Error al iniciar la cámara:<br>" +
          error.message;

      }

    }


    // =====================================================
    // DETENER CÁMARA
    // =====================================================

    function detenerScanner() {

      try {

        if (controles) {

          if (
            typeof controles.stop ===
            "function"
          ) {

            controles.stop();

          }

          controles = null;

        }


        if (lector) {

          if (
            typeof lector.reset ===
            "function"
          ) {

            lector.reset();

          }

          lector = null;

        }


        if (video.srcObject) {

          video.srcObject
            .getTracks()
            .forEach(
              function(track) {

                track.stop();

              }
            );

          video.srcObject = null;

        }

      } catch (error) {

        console.log(error);

      }

    }


    // =====================================================
    // REGRESAR A GOOGLE APPS SCRIPT
    // =====================================================

    function regresarAAppsScript(codigo) {

      const parametros =
        new URLSearchParams(
          window.location.search
        );


      const retorno =
        parametros.get("retorno");


      if (!retorno) {

        estado.innerHTML =
          "Código detectado:<br>" +
          codigo;

        resultado.innerHTML =
          codigo;

        return;
      }


      // Recuperar URL original

      const url =
        decodeURIComponent(
          retorno
        );


      // Agregar barcode

      const separador =
        url.includes("?")
          ? "&"
          : "?";


      const urlFinal =
        url +
        separador +
        "barcode=" +
        encodeURIComponent(
          codigo
        );


      console.log(
        "Regresando a Apps Script:",
        urlFinal
      );


      // Regresar en la MISMA pestaña

      window.location.href =
        urlFinal;

    }


    // =====================================================
    // CANCELAR
    // =====================================================

    function volver() {

      detenerScanner();


      const parametros =
        new URLSearchParams(
          window.location.search
        );


      const retorno =
        parametros.get("retorno");


      if (retorno) {

        window.location.href =
          decodeURIComponent(
            retorno
          );

      } else {

        window.history.back();

      }

    }


    // =====================================================
    // LIMPIAR CÁMARA
    // =====================================================

    window.addEventListener(
      "beforeunload",
      function() {

        detenerScanner();

      }
    );

  </script>

</body>

</html>
