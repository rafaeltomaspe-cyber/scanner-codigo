<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escáner</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    video {
      width: 100%;
      height: 75vh;
      object-fit: cover;
    }

    #estado {
      padding: 20px;
      font-size: 18px;
    }

    #resultado {
      font-size: 24px;
      font-weight: bold;
      padding: 20px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div id="estado">
    Iniciando lector...
  </div>

  <video id="video" autoplay muted playsinline></video>

  <div id="resultado"></div>

  <button onclick="volver()">
    Cancelar
  </button>


  <!-- LIBRERÍA LOCAL -->
  <script src="./zxing-browser.min.js"></script>


  <script>

    const video = document.getElementById("video");
    const estado = document.getElementById("estado");
    const resultado = document.getElementById("resultado");

    let lector;
    let controles;


    function iniciar() {

      console.log("ZXingBrowser:", window.ZXingBrowser);

      if (!window.ZXingBrowser) {

      estado.innerHTML =
        "❌ ZXingBrowser NO está cargado";

      return;
      }


      estado.innerHTML =
        "📷 Apunta al código de barras";


      lector =
        new ZXingBrowser.BrowserMultiFormatReader();


      lector
        .decodeFromConstraints(
          {
            video: {
              facingMode: {
                ideal: "environment"
              },
              width: {
                ideal: 1920
              },
              height: {
                ideal: 1080
              }
            },
            audio: false
          },
          video,
          function(resultadoCodigo, error) {

            if (resultadoCodigo) {

              const codigo =
                resultadoCodigo.getText();

              console.log(
                "Código:",
                codigo
              );

              resultado.innerHTML =
                "Código detectado:<br>" +
                codigo;

              detener();

              enviarCodigo(codigo);
            }

          }
        )
        .then(function(c) {

          controles = c;

        })
        .catch(function(error) {

          console.error(error);

          estado.innerHTML =
            "❌ Error al iniciar cámara:<br>" +
            error.message;

        });
    }


    function detener() {

      try {

        if (controles) {
          controles.stop();
        }

        if (lector) {
          lector.reset();
        }

        if (video.srcObject) {

          video.srcObject
            .getTracks()
            .forEach(function(track) {
              track.stop();
            });
        }

      } catch (e) {

        console.log(e);

      }
    }


    function enviarCodigo(codigo) {

      const parametros =
        new URLSearchParams(
          window.location.search
        );

      const retorno =
        parametros.get("retorno");


      if (!retorno) {

        estado.innerHTML =
          "Código detectado: " + codigo;

        return;
      }


      const url =
        decodeURIComponent(retorno);


      const separador =
        url.includes("?")
          ? "&"
          : "?";


      window.location.href =
        url +
        separador +
        "barcode=" +
        encodeURIComponent(codigo);
    }


    function volver() {

      detener();

      const parametros =
        new URLSearchParams(
          window.location.search
        );

      const retorno =
        parametros.get("retorno");


      if (retorno) {

        window.location.href =
          decodeURIComponent(retorno);

      } else {

        window.history.back();

      }
    }


    iniciar();

  </script>

</body>
</html>
